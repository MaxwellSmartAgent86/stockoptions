<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The bench — Five answers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="hud">
    <a class="hud-link" href="index.html">Study</a>
    <a class="hud-link" href="games.html">Games</a>
    <p class="hud-score">Score <span id="score">0</span></p>
    <p class="hud-lives" id="lives">Lives 3</p>
    <button type="button" class="fire" id="stamp">Stamp</button>
  </header>
  <section class="prompt" aria-live="polite">
    <p class="kind">What is on</p>
    <h1 id="ask">Stamp the parts.</h1>
    <p class="clock" id="clock"></p>
    <p class="because" id="because"></p>
    <button type="button" class="continue" id="continue" hidden>Continue</button>
  </section>
  <div class="field">
    <div class="parts" id="parts"></div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="overlay-title">The bench</h2>
      <p id="overlay-body">The ticket names a structure. Tap only the parts that belong, then Stamp. An extra part is a miss. You have sixteen seconds. Number keys toggle the parts. Enter stamps.</p>
      <button type="button" class="start" id="start">Start</button>
    </div>
  </div>
  <script src="trades.js"></script>
  <script src="bench.js"></script>
</body>
</html>
